<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14100e">
<title>Chilis bestellen – Opa Reiters Chili Sammlung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/order.css">
</head>
<body>
  <div class="order-page">
    <div class="order-header">
      <h1>🌶️ Chilis bestellen</h1>
      <p>Mengen wählen und unverbindlich anfragen – keine Registrierung nötig.</p>
    </div>

    <div id="testBanner" class="order-testbanner" hidden>
      Testvorschau: Diese Bestellanfrage geht an keine echte Datenbank, sondern
      nur an den Testspeicher deines Browsers.
    </div>

    <div id="chiliList"></div>

    <form id="orderForm" class="order-form" hidden>
      <h2>Deine Kontaktdaten</h2>
      <label for="fName">Name *</label>
      <input type="text" id="fName" required autocomplete="name">
      <label for="fKontakt">Kontaktmöglichkeit (E-Mail oder Telefon) *</label>
      <input type="text" id="fKontakt" required autocomplete="email">
      <label for="fNachricht">Nachricht (optional)</label>
      <textarea id="fNachricht"></textarea>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">Bestellanfrage senden</button>
      <div id="statusMsg" class="order-status-msg"></div>
    </form>

    <div id="emptyMsg" class="order-empty" hidden>Aktuell sind keine Chilis zur Bestellung freigegeben.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/config.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/src/core.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/src/order-core.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/src/order-data.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/buildwithyr/Chilli-Sammlung-@bestellbranch/src/order-public.js"></script>
</body>
</html>
